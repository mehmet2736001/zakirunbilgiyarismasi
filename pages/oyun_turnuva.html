<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Haftalık Şampiyonalar & Turnuvalar // Zakirun Kur'an Oyunları</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        studio: {
                            950: '#030712',
                            900: '#0b0f19',
                            800: '#111827',
                            gold: '#fbbf24',
                            amber: '#f59e0b',
                            crimson: '#ef4444',
                            emerald: '#10b981',
                            cyan: '#06b6d4',
                            violet: '#8b5cf6'
                        }
                    },
                    fontFamily: {
                        orbitron: ['Orbitron', 'sans-serif'],
                        amiri: ['ZakirunUthmani', 'Amiri', 'serif'],
                        inter: ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;600;700;900&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            background: radial-gradient(circle at 50% 10%, #1e1b4b 0%, #090d16 55%, #030712 100%);
            color: #f3f4f6;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
        }
        .match-card {
            background: rgba(17, 24, 39, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 10px 14px;
            transition: all 0.2s ease;
        }
        .match-card:hover {
            border-color: #06b6d4;
            transform: translateY(-2px);
        }
    </style>
</head>
<body class="selection:bg-amber-500 selection:text-black flex flex-col min-h-screen">

    <!-- TOP BAR -->
    <header class="border-b border-white/5 bg-studio-950/80 backdrop-blur-md sticky top-0 z-50 px-4 py-3">
        <div class="max-w-5xl mx-auto flex items-center justify-between gap-3">
            <a href="/" class="px-3.5 py-1.5 rounded-xl bg-studio-900 border border-gray-700 hover:border-amber-500 text-gray-300 hover:text-white transition flex items-center gap-2 text-xs font-bold">
                <span>←</span>
                <span>Ana Sayfa</span>
            </a>

            <div class="text-xs sm:text-sm font-black text-cyan-400 font-mono tracking-wider flex items-center gap-2">
                <span>🏆</span>
                <span>HAFTALIK HÂFIZLIK ŞAMPİYONALARI</span>
            </div>

            <div class="text-xs font-mono text-gray-400">
                16'lı Kupa Ağacı
            </div>
        </div>
    </header>

    <!-- ANA ALAN -->
    <main class="max-w-5xl mx-auto px-4 py-8 flex-1 w-full space-y-8">

        <!-- Turnuva Seçici Sekmeler -->
        <div class="flex items-center justify-center gap-2 flex-wrap" id="tourn-tabs">
            <button onclick="loadTournament('tourn-amme-16')" class="px-4 py-2 rounded-xl bg-cyan-500 text-black font-black text-xs transition shadow-lg">
                Amme Cüzü Kupası (16'lı)
            </button>
            <button onclick="loadTournament('tourn-yasin-16')" class="px-4 py-2 rounded-xl bg-studio-900 border border-gray-700 text-gray-300 hover:text-white text-xs font-bold transition">
                Yâsîn & Mülk Kupası (16'lı)
            </button>
            <button onclick="loadTournament('tourn-bakara-32')" class="px-4 py-2 rounded-xl bg-studio-900 border border-gray-700 text-gray-300 hover:text-white text-xs font-bold transition">
                Büyük Bakara Kupası (32'li)
            </button>
        </div>

        <!-- Turnuva Bilgi Kartı -->
        <div class="bg-studio-900/90 border border-cyan-500/30 rounded-3xl p-6 shadow-xl flex flex-col sm:flex-row items-center justify-between gap-4">
            <div class="space-y-1 text-center sm:text-left">
                <div class="text-xs font-mono text-cyan-400 uppercase font-bold" id="tourn-category">
                    30. CÜZ HIFZ KARŞILAŞMALARI
                </div>
                <h1 class="text-2xl font-black text-white" id="tourn-title">
                    Haftalık Amme Cüzü Kupası
                </h1>
                <p class="text-xs text-gray-400">
                    20 Hâfız bot ve sizin katılımınızla düzenlenen 4 turlu eleme ağacı.
                </p>
            </div>
            <button onclick="playNextTournamentMatch()" class="px-6 py-3 rounded-2xl bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-black font-black text-xs shadow-lg hover:scale-105 active:scale-95 transition flex items-center gap-2">
                <span>⚡</span>
                <span>Maçı Oyna / Simüle Et</span>
            </button>
        </div>

        <!-- 16'lı Turnuva Ağacı Görünümü -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4" id="bracket-grid">
            <!-- 1. Tur (Son 16) -->
            <div class="space-y-3">
                <div class="text-xs font-mono font-bold text-gray-400 border-b border-white/5 pb-2">
                    SON 16 (8 Eşleşme)
                </div>
                <div class="space-y-2.5" id="round-1-matches"></div>
            </div>

            <!-- 2. Tur (Çeyrek Final) -->
            <div class="space-y-3">
                <div class="text-xs font-mono font-bold text-amber-400 border-b border-white/5 pb-2">
                    ÇEYREK FİNAL (4 Eşleşme)
                </div>
                <div class="space-y-4 pt-4" id="round-2-matches"></div>
            </div>

            <!-- 3. Tur (Yarı Final) -->
            <div class="space-y-3">
                <div class="text-xs font-mono font-bold text-purple-400 border-b border-white/5 pb-2">
                    YARI FİNAL (2 Eşleşme)
                </div>
                <div class="space-y-8 pt-10" id="round-3-matches"></div>
            </div>

            <!-- 4. Tur (Büyük Final) -->
            <div class="space-y-3">
                <div class="text-xs font-mono font-bold text-emerald-400 border-b border-white/5 pb-2">
                    BÜYÜK FİNAL 🏆
                </div>
                <div class="space-y-12 pt-20" id="round-4-matches"></div>
            </div>
        </div>

    </main>

    <script>
        let currentTournId = 'tourn-amme-16';
        let tournData = null;

        async function loadTournament(tournId) {
            currentTournId = tournId;
            try {
                const res = await fetch(`/api/gameshow/tournaments/${tournId}/bracket`);
                if (res.ok) {
                    tournData = await res.json();
                    renderBracket();
                }
            } catch (e) {
                console.error('Bracket fetch error:', e);
            }
        }

        function renderBracket() {
            if (!tournData) return;
            document.getElementById('tourn-title').innerText = tournData.name || 'Turnuva Ağacı';

            const rounds = tournData.rounds || [];
            ['round-1-matches', 'round-2-matches', 'round-3-matches', 'round-4-matches'].forEach((id, rIdx) => {
                const container = document.getElementById(id);
                const matches = rounds[rIdx] || [];
                container.innerHTML = matches.map(m => `
                    <div class="match-card">
                        <div class="flex items-center justify-between text-xs">
                            <span class="${m.winner === m.player1 ? 'font-black text-emerald-400' : 'text-gray-300'}">${m.player1}</span>
                            <span class="font-mono text-[11px] text-gray-500">${m.score1 !== undefined ? m.score1 : '-'}</span>
                        </div>
                        <div class="border-t border-white/5 my-1.5"></div>
                        <div class="flex items-center justify-between text-xs">
                            <span class="${m.winner === m.player2 ? 'font-black text-emerald-400' : 'text-gray-300'}">${m.player2}</span>
                            <span class="font-mono text-[11px] text-gray-500">${m.score2 !== undefined ? m.score2 : '-'}</span>
                        </div>
                    </div>
                `).join('');
            });
        }

        async function playNextTournamentMatch() {
            try {
                const res = await fetch(`/api/gameshow/tournaments/${currentTournId}/play-match`, { method: 'POST' });
                if (res.ok) {
                    const data = await res.json();
                    alert(`⚡ Karşılaşma Tamamlandı:\n${data.match.player1} vs ${data.match.player2}\nKazanan: ${data.match.winner}`);
                    loadTournament(currentTournId);
                }
            } catch (e) {
                console.error(e);
            }
        }

        loadTournament('tourn-amme-16');
    </script>
</body>
</html>
